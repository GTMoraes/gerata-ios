name: GerAta
options:
  bundleIdPrefix: com.gtm
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
packages:
  Argmax:
    url: https://github.com/argmaxinc/argmax-oss-swift
    # = tag v1.1.0, o mesmo commit do Estúdio. Fixado por commit: o pacote usa unsafeFlags e o
    # SwiftPM recusa isso em dependências resolvidas por versão.
    revision: 1e2a163736dfa5a198e637ae44c114e1c6d5cc2d
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
targets:
  GerAta:
    type: application
    platform: iOS
    sources:
      - App
    dependencies:
      # transcrição no iPhone (Whisper no Neural Engine), a mesma do Estúdio
      - package: Argmax
        product: WhisperKit
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: GerAta
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: Fundo
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Dark
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gtm.gerata
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    scheme: {}
